name: "Website Proposal"
description: "Propose a public website experience or content change"
title: "[Website]: "
labels: ["type:website", "status:proposed"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Do not include secrets or personal data."
  - type: input
    id: field-1
    attributes:
      label: "Area or page"
      description: "Which existing page or feature?"
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: "User need"
      description: "Describe the audience and desired outcome."
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: "Proposed experience"
      description: "Behavior, accessibility, responsive layout, and design considerations."
    validations:
      required: true
  - type: textarea
    id: field-4
    attributes:
      label: "Acceptance criteria"
      description: "Observable, testable criteria."
    validations:
      required: true
