name: Agent scaffolding integrity
on:
  pull_request:
    paths:
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'tools/agent/**'
      - 'tools/skills/**'
      - 'skills/**'
      - '.github/workflows/agent-scaffolding.yml'
      - 'package.json'
      - 'nx.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node tools/agent/validate-scaffolding.mjs --all
      - run: node tools/skills/test-bootstrap.mjs
